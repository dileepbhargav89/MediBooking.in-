name: medibooking-enterprise

services:
  postgres:
    image: postgres:16-alpine
    container_name: medibooking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medibooking
      POSTGRES_USER: medibooking_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mb_secure_prod_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibooking_user -d medibooking"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medibooking-network

  redis:
    image: redis:7-alpine
    container_name: medibooking-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-mb_redis_secure_pass_2026}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mb_redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - medibooking-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: medibooking-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://medibooking_user:${POSTGRES_PASSWORD:-mb_secure_prod_password_2026}@postgres:5432/medibooking
      REDIS_URL: redis://:${REDIS_PASSWORD:-mb_redis_secure_pass_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-mb_jwt_enterprise_secret_production_2026}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-1376418502227507}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-1483246103715802}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TvOutO2qI4jaN0}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-w8WBkozXwQOSZtx7f15gcAC9}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - medibooking-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: medibooking-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - medibooking-network

  nginx:
    image: nginx:1.27-alpine
    container_name: medibooking-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - medibooking-network

volumes:
  postgres_data:
  redis_data:

networks:
  medibooking-network:
    driver: bridge

